<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тренажёр по БД и ИС</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна колонка до 760px; шапка с кругом и полосой прогресса, ниже карточка вопроса и навигация */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunken:#E7EAF1; --line:#D3D8E2; --fg:#141824; --muted:#5A6275;
  --accent:#2E47C4; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB;
  --ok:#1C7A48; --ok-soft:#E0F2E7; --bad:#BC3830; --bad-soft:#FBE5E2; --maybe:#8E6200; --maybe-soft:#FAF0D6;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F121A; --surface:#171B26; --sunken:#1F2432; --line:#2C3345; --fg:#E6E9F1; --muted:#9AA2B6;
    --accent:#8D9DFF; --accent-ink:#0F121A; --accent-soft:#242C4F;
    --ok:#5BCB8D; --ok-soft:#163323; --bad:#F27E74; --bad-soft:#3B1D1B; --maybe:#E3B54C; --maybe-soft:#3A2F13;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#171B26; --sunken:#1F2432; --line:#2C3345; --fg:#E6E9F1; --muted:#9AA2B6;
  --accent:#8D9DFF; --accent-ink:#0F121A; --accent-soft:#242C4F;
  --ok:#5BCB8D; --ok-soft:#163323; --bad:#F27E74; --bad-soft:#3B1D1B; --maybe:#E3B54C; --maybe-soft:#3A2F13;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
.wrap{max-width:792px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-block:10px 8px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-mark{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 7px;line-height:1}
.brand-name{font-family:var(--font-display);font-weight:500;font-size:15px;line-height:1.25}
.brand-sub{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:6px}
.round-row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 14px;flex-wrap:wrap}
.round-info{min-width:0;flex:1 1 260px}
.round-name{font-weight:600;font-size:14px;line-height:1.3}
.round-sql{display:block;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;color:var(--muted);margin-top:2px}
.round-stats{display:flex;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:600}
.stat.ok b{color:var(--ok)}
.stat.bad b{color:var(--bad)}
.strip{display:flex;gap:1px;height:18px;align-items:center}
.seg{flex:1 1 0;min-width:0;height:100%;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center}
.seg::before{content:"";display:block;width:100%;height:6px;border-radius:2px;background:var(--sunken)}
.seg.ok::before{background:var(--ok)}
.seg.bad::before{background:var(--bad)}
.seg.cur::before{height:16px;background:var(--accent)}
.seg.cur.ok::before{background:var(--ok)}
.seg.cur.bad::before{background:var(--bad)}
.seg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Кнопки */
.btn{font-size:14px;font-weight:600;border-radius:9px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:40px;line-height:1.2;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.ord-item:focus-visible,.chip-opt:focus-visible,.letbtn:focus-visible,.row:focus-visible,.fchip:focus-visible,.menu-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{padding-block:18px 56px}

/* Карточка вопроса */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.card.is-ok{border-color:var(--ok)}
.card.is-bad{border-color:var(--bad)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.qnum{font-family:var(--font-mono);font-weight:600;color:var(--fg);font-size:13px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:600;font-size:12px}
.qtext{font-size:19px;line-height:1.42;font-weight:600;margin:0;text-wrap:pretty}
.hint{margin:0;font-size:13px;color:var(--muted)}
.tag-var{background:var(--maybe-soft);color:var(--maybe)}
.variant{border:1px dashed var(--maybe);background:var(--maybe-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.var-h{font-weight:600;font-size:13.5px;color:var(--maybe)}
.var-btns{display:flex;flex-wrap:wrap;gap:6px}
.vbtn{font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vbtn:disabled{cursor:default;opacity:.75}
.vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.var-src{margin:0;font-size:13px;font-weight:600}

.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:11px;row-gap:3px;align-items:start;text-align:left;font-size:15.5px;line-height:1.4;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:1}
.box{width:18px;height:18px;margin-top:2px;border:2px solid var(--muted);border-radius:5px}
.opts.single .box{border-radius:50%}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .box{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--ok-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt.missed .box{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .box{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 3px var(--bad-soft)}
.opt.maybe{border-color:var(--maybe);background:var(--maybe-soft)}
.opt.maybe .box{border-color:var(--maybe)}
.opt.dim{opacity:.62}
.opt-tag{grid-column:2;font-size:12px;font-weight:600;color:var(--muted)}
.opt.good .opt-tag,.opt.missed .opt-tag{color:var(--ok)}
.opt.wrong .opt-tag{color:var(--bad)}
.opt.maybe .opt-tag{color:var(--maybe)}

.blabel{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.ord{display:grid;gap:8px}
.ord-ans{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ord-item{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;font-size:15px;line-height:1.4;padding:9px 12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;color:var(--fg);cursor:pointer}
.ord-item:disabled{cursor:default}
.ord-n{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.ord-item.good{border-color:var(--ok);background:var(--ok-soft)}
.ord-item.good .ord-n{color:var(--ok)}
.ord-item.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord-item.wrong .ord-n{color:var(--bad)}
.ord-empty{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:14px}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{font-size:14.5px;line-height:1.35;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;max-width:100%}
.chip-opt:hover{border-color:var(--accent)}

.legend{list-style:none;margin:0;padding:12px 14px;background:var(--sunken);border-radius:10px;display:grid;gap:7px;font-size:14.5px;line-height:1.4}
.legend li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}
.let{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.match{display:grid;gap:8px}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.mleft{font-weight:600;font-size:15px;line-height:1.4}
.mfix{display:block;font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--bad);margin-top:2px}
.lets{display:flex;flex-wrap:wrap;gap:6px}
.letbtn{font-family:var(--font-mono);font-weight:600;min-width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.letbtn:hover:not(:disabled){border-color:var(--accent)}
.letbtn:disabled{cursor:default}
.letbtn.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mrow.good{border-color:var(--ok);background:var(--ok-soft)}
.mrow.good .letbtn.sel{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow.wrong .letbtn.sel{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.letbtn.right{outline:2px dashed var(--ok);outline-offset:1px}

.inp{font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%;max-width:420px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp:disabled{opacity:.8}

.extra{display:grid;gap:8px;min-width:0}
.schema{margin:0;font-size:13px;color:var(--muted)}
.sql{font-family:var(--font-mono);font-size:13.5px;line-height:1.55;background:var(--sunken);border-radius:10px;padding:12px 14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tables{display:flex;flex-wrap:wrap;gap:12px 20px}
.tbl-wrap{overflow-x:auto;min-width:0;max-width:100%}
table.data{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.data caption{caption-side:top;text-align:left;font-weight:600;font-size:13px;padding-bottom:5px}
table.data th,table.data td{border:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
table.data th{background:var(--sunken);font-weight:600;font-size:12.5px}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.fb{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.fb-v{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.2}
.card.is-ok .fb-v{color:var(--ok)}
.card.is-bad .fb-v{color:var(--bad)}
.fb-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:6px}
.fb-ex,.fb-ans{margin:0;max-width:68ch}
.fb-ans{font-weight:600}
.fb-list{margin:0;padding-left:22px;display:grid;gap:2px}
.fb-pairs{display:grid;gap:6px}
.fb-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:8px;font-size:14.5px;line-height:1.4}
.fb-pair .l{font-weight:600}
.fb-pair .arrow{color:var(--muted)}

.qnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.pos{font-family:var(--font-mono);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* Итоги, список, меню */
.h1{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.muted{color:var(--muted);margin:0}
.stack{display:grid;gap:16px}
.backbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.score{font-family:var(--font-display);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-family:var(--font-body);font-size:17px;font-weight:500;color:var(--muted);margin-left:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.bar span{display:block;height:100%}
.bar .b-ok{background:var(--ok)}
.bar .b-bad{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;color:var(--fg);cursor:pointer;width:100%}
.row:hover{border-color:var(--accent)}
.num{font-family:var(--font-mono);font-weight:600;font-size:13px;min-width:36px;text-align:center;border-radius:6px;padding:3px 4px;background:var(--sunken);color:var(--muted)}
.row.ok .num{background:var(--ok-soft);color:var(--ok)}
.row.bad .num{background:var(--bad-soft);color:var(--bad)}
.rt{font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rk{font-size:12px;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:14px 0 2px}
.menu-list{display:grid;gap:8px}
.menu-item{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;width:100%}
.menu-item:hover:not(:disabled){border-color:var(--accent)}
.menu-item:disabled{opacity:.5;cursor:not-allowed}
.mi-t{font-weight:600;font-size:15px}
.mi-d{font-size:13px;color:var(--muted)}
.mi-sql{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}

@media (max-width:600px){
  .top{position:static}
  body::before{display:none}
  .brand-sub{display:none}
  .card{padding:16px}
  .qtext{font-size:17.5px}
  .fb-pair{grid-template-columns:1fr;gap:0}
  .fb-pair .arrow{display:none}
  .rk{display:none}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .score{font-size:40px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="top-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">БД</span>
        <div>
          <div class="brand-name">Тренажёр по БД и ИС</div>
          <div class="brand-sub">Тест по основам БД · часть 1 · 70 вопросов, 78 заданий · варианты составил Claude по лекциям; в 8 вопросах два варианта — из файла и Claude, пройти нужно оба</div>
        </div>
      </div>
      <nav class="top-actions">
        <button id="btn-list" class="btn ghost" type="button" aria-pressed="false">Все вопросы</button>
        <button id="btn-menu" class="btn ghost" type="button" aria-pressed="false">Новый круг</button>
      </nav>
    </div>
    <div class="round-row">
      <div class="round-info">
        <div id="round-name" class="round-name">Круг 1 · Весь тест по порядку</div>
        <code id="round-sql" class="round-sql">SELECT * FROM Вопросы ORDER BY Номер</code>
        <div id="sync" class="sync">Прогресс сохраняется в этом браузере</div>
      </div>
      <div id="round-stats" class="round-stats"></div>
    </div>
    <div id="strip" class="strip" aria-label="Вопросы текущего круга"></div>
  </div>
</header>

<main class="wrap main">
  <section id="v-test" aria-live="polite"></section>
  <section id="v-summary" hidden></section>
  <section id="v-list" hidden></section>
  <section id="v-view" hidden></section>
  <section id="v-menu" hidden></section>
</main>

<script>
"use strict";
/* ---------- Справочники ---------- */
const TYPE = {s:"Один ответ", m:"Несколько ответов", o:"Последовательность", p:"Соответствие", x:"Текстовый ответ", n:"Введите число"};
const TYPE_SHORT = {s:"1 ответ", m:"неск. ответов", o:"порядок", p:"соответствие", x:"текст", n:"число"};
const HINT = {
  s:"Выберите один вариант.",
  m:"Отметьте все верные варианты.",
  o:"Нажимайте варианты в нужном порядке. Нажатие на пункт в вашем списке убирает его.",
  p:"Для каждой строки выберите букву из списка вариантов.",
  x:"Введите слово или короткую фразу и нажмите «Проверить».",
  n:"Введите число и нажмите «Проверить»."
};
const SECT = [null,
  {name:"ИС, БД и данные", from:1, to:15},
  {name:"Реляционная модель и Access", from:16, to:41},
  {name:"СУБД, транзакции и SQL", from:42, to:58},
  {name:"ООП, сети и Semantic Web", from:59, to:70}
];
const LET = "АБВГДЕЖЗИКЛМН";
const DATA_V = 4;

/* ---------- Вопросы ---------- */
const Q = [
{n:1, t:"s", q:"Основные компоненты информационной системы. Состав информационной системы включает:",
 o:["+Модель данных, СУБД и приложения БД","-Аппаратные средства, программное обеспечение, правила, данные и специалистов","-Файлы, каталоги и файловую систему","-Таблицы, запросы, формы и отчёты","-Данные, метаданные и индексы","-Клиент, сервер и сеть"],
 ex:"ИС = база данных (модель данных + СУБД) + приложения БД. Пользователи работают не с СУБД напрямую, а с прикладной системой, построенной на её платформе. Пять компонентов «аппаратура, ПО, правила, данные, специалисты» — это определение БД как системы, а не ИС. В тесте может быть написано: «база данных и приложения»."},
{n:2, t:"m", q:"Определение базы данных. Отметьте верные формулировки.",

 ex:"Лекция 2: БД — организованная коллекция логически связанных данных и способов доступа к ним (An organized collection of logically related data). «Диск с данными — это не БД». Набор программ — это СУБД, набор правил — модель данных, именованная область памяти — файл, данные о данных — метаданные."},
{n:3, t:"m", q:"К недостаткам использования файловых систем для организации баз данных относятся:",
 o:["+Сильная зависимость между программами и данными","+Длительное время разработки приложений","+Чрезмерная программная поддержка доступа к данным внутри приложений","+Трудности организации доступа к данным","+Избыточность хранения: дублирование данных в разных файлах","+Ограниченность совместного доступа к данным","+Изолированность данных: много файлов и форматов","+Слабая защита, видимость путей и имён файлов","+Сложность синхронного внесения изменений, нет поддержки целостности","-Независимость программ от данных","-Наличие единого языка запросов SQL","-Автоматическое восстановление после сбоев","-Поддержка транзакций","-Развитые средства защиты данных"],
 ex:"Недостатки из лекции 1: зависимость программ от данных (долгая разработка, избыточная программная поддержка), трудный доступ, избыточность, ограниченный совместный доступ (нельзя одновременно менять разные записи одного файла), изолированность, слабая безопасность, нет атомарности обновлений и целостности. Независимость, SQL, восстановление и транзакции — это преимущества БД."},
{n:4, t:"m", q:"Какие из перечисленных видов данных относятся к слабо- или неструктурированным данным?",
 o:["+Тексты и документы","+Графика и изображения","+Мультимедиа: видео, аудио, речь","+Тексты программ и объектные модули","+Данные, произвольные по форме","+Данные, для которых правила и форматы определены лишь в самом общем виде","-Таблицы реляционной БД (записи и поля)","-Матрицы","-Списки и вектора","-Индексы таблиц"],
 ex:"Неструктурированные — произвольные по форме: тексты, графика, мультимедиа. Слабоструктурированные — правила и форматы заданы лишь в самом общем виде. Их обычно хранят файловые системы: документы, тексты программ, объектные модули, графику, мультимедиа. Около 90% всех данных — неструктурированные."},
{n:5, t:"m", q:"Какие из перечисленных видов данных относятся к структурированным данным?",

 ex:"Три типа структур данных: линейная (списки, вектора — адрес равен номеру элемента), табличная (таблицы, матрицы — адрес из нескольких параметров), иерархическая (адрес — маршрут от вершины дерева). У структурированных данных появляется атрибут «адрес»."},
{n:6, t:"m", q:"Укажите основные направления автоматизации обработки неструктурированных данных в информационных системах.",
 o:["+Использование языка XML (импорт XML в БД, Semantic Web)","+Системы управления контентом (CMS), в том числе системы управления документами (СУД, DMS)","+Text Mining: извлечение информации, реферирование, категоризация, кластеризация","-OLAP-системы","-Реляционные СУБД и SQL","-Стандарты MRP и ERP","-Инвертированные списки","-Система показателей BSC"],
 ex:"Три направления развития ИС для неструктурированных данных: 1) XML — описание данных (HTML отвечает за вид, XML — за смысл); 2) CMS и системы документооборота; 3) Text Mining. OLAP и Data Mining работают с хранилищами структурированных данных."},
{n:7, t:"s", q:"Выберите термин. «Данные о данных и способах доступа к ним, их обработки и обслуживания» — это …",

{n:8, t:"s", q:"Выберите термин. «Набор правил и определений, которым подчиняются все объекты, находящиеся внутри базы данных» — это …",

{n:9, t:"m", q:"Укажите основные преимущества использования баз данных по сравнению с файловыми системами:",
 o:["+Независимость данных, сокращение программной поддержки доступа","+Рост эффективности разработки приложений","+Возможность создания и использования стандартов","+Минимальная избыточность хранения данных","+Согласованность данных и совместный доступ к ним","+Улучшенный доступ к данным","+Рост качества данных","+Безопасность (защита) данных","+Сохранение и восстановление (Backup/Recovery)","-Сильная связь программ и данных","-Дублирование данных в разных файлах","-Изолированность данных","-Отсутствие метаданных","-Видимость путей и имён файлов пользователям"],
 ex:"Преимущества БД (лекция 2): независимость данных, меньше программной поддержки, рост эффективности разработки, стандарты, минимальная избыточность, согласованность и совместный доступ, улучшенный доступ, качество данных, безопасность, резервирование и восстановление. Остальные варианты — недостатки файловых систем."},
{n:10, t:"o", q:"Расставьте в порядке исторического развития ОСНОВНЫЕ МЕТОДЫ ОБРАБОТКИ И АНАЛИЗА ДАННЫХ в информационных системах.",
 items:["Простые запросы и отчёты","Стандартизация и автоматизация отчётности (MRP, MRP II, ERP)","Моделирование — сценарии «что — если»","OLAP — оперативная аналитическая обработка","Data Mining — интеллектуальный анализ данных","Business Intelligence — бизнес-аналитика"],
 ex:"Конец 1960-х — начало 1980-х: простые запросы и отчёты. Затем стандарты MRP/ERP и автоматизация отчётности. Середина 1990-х: моделирование «что-если» и OLAP. Конец 1990-х: Data Mining на основе хранилищ данных. Современный этап: Business Intelligence."},
{n:11, t:"x", q:"Введите термин. «Результат взаимодействия данных и адекватных им методов» — это …",
 acc:["информац"], ans:"Информация",
 ex:"Информация — результат взаимодействия данных и адекватных им методов. Английская формулировка: data processed to be useful in decision-making — данные, обработанные для принятия решений."},
{n:12, t:"s", q:"Структуры данных, индексы, процедуры, первичные и внешние ключи, представления — это …",
 o:["+Метаданные","-Данные","-Информация","-Модель данных","-Объекты MS Access","-Приложения БД"],
 ex:"Это метаданные — данные о данных и способах доступа, обработки и обслуживания. При размещении данных в БД появляется значительный объём метаданных."},
{n:13, t:"s", q:"Выберите термин. «Объект базы данных, создаваемый с целью повышения производительности выполнения запросов» — это …",
 o:["+Индекс","-Первичный ключ","-Представление (view)","-Журнал базы данных","-Домен","-Триггер"],
 ex:"Индекс — объект БД для ускорения запросов. Формируется из значений одного или нескольких столбцов и указателей на строки. Другая формулировка (ранние БД): специальная таблица из двух полей — значение ключа и номер записи, упорядоченная по ключу. Поле-идентификатор — это первичный ключ, сохранённый запрос — представление, записи об изменениях — журнал."},
{n:14, t:"s", q:"Индексы в базе данных используются:",
 o:["+Для повышения скорости поиска данных и выполнения запросов","-Для защиты данных от несанкционированного доступа","-Для восстановления БД после сбоев","-Для уменьшения объёма БД","-Для хранения истории изменений","-Для оформления отчётов"],
 ex:"Без индекса строку ищут последовательным просмотром таблицы. Индекс позволяет быстро найти строку по заданному значению. Составные индексы (несколько полей) ускоряют поиск сразу по нескольким полям."},
{n:15, t:"o", q:"Эволюция современных баз данных: расставьте в порядке появления с конца 1960-х годов.",

 ex:"Первое поколение: инвертированные списки (1966–69), иерархические (1969–73), сетевые (1973–76). Второе: реляционные (1976–90, модель Кодда 1970 г.). Далее постреляционные/многомерные (1990–93), объектно-ориентированные (1994–2000), хранилища данных (конец 1990-х)."},
{n:16, t:"m", q:"Какие три ключевые инновации связаны с появлением первого поколения дореляционных баз данных?",
 o:["+Таблицы: данные хранятся в таблицах с записями фиксированной длины","+Индексы (инвертированные списки)","+Связи между таблицами для поддержки целостности","-Язык SQL","-Транзакции","-Представления (views)","-Классы и объекты","-Реляционная алгебра","-Архитектура «клиент-сервер»"],
 ex:"Ранние БД дали три инновации: таблицы, индексы (инвертированные списки, ADABAS, dBase, Clipper) и связи между таблицами для поддержки целостности (иерархия предок–потомок: потомок не существует без родителя). SQL, транзакции и объекты появились позже."},
{n:17, t:"m", q:"Реляционная модель данных включает следующие компоненты:",

 ex:"По Дейту реляционная модель включает три компонента: структурный (нормализованное n-арное отношение), манипуляционный (реляционная алгебра и исчисление) и целостный (целостность сущностей и ссылок). Пользовательский, концептуальный и внутренний — это уровни архитектуры БД."},
{n:18, t:"x", q:"Введите ответ. Все объекты, хранимые внутри реляционной БД (исходные таблицы, представления, отчёты, формы, запросы, индексы), сводятся к двумерным таблицам особого вида. Что они собой представляют?",
 acc:["отношени","relation"], ans:"Отношение (N-арное нормальное отношение, relation)",
 ex:"Каждая такая таблица — N-арное нормальное отношение (relation), то есть простое множество: значения атомарны, дубликатов нет."},
{n:19, t:"s", q:"Для обработки данных в реляционной БД используется …",
 o:["+Аппарат теории множеств — реляционная алгебра и реляционное исчисление","-Навигационный доступ по записям","-Аппарат указателей (ссылок)","-Инвертированные списки","-Матричная алгебра","-Методы объектно-ориентированного программирования"],
 ex:"Манипуляционная часть: реляционная алгебра (теория множеств: объединение, пересечение, разность, произведение…) и реляционное исчисление (исчисление предикатов первого порядка). Это сделало механизм обработки независимым от содержания БД."},
{n:20, t:"x", q:"Введите термин. «Подмножество значений некоторого типа данных, имеющих определённый смысл» — это …",
 acc:["домен"], ans:"Домен",
 ex:"Домен — уточнение типа данных, семантическое понятие. Свойства: уникальное имя; определён на простом типе или другом домене; может иметь логическое условие; сравнимы только данные одного домена. Пример: «Номера пропусков» и «Номера групп» — оба целые числа, но несравнимы."},
{n:21, t:"m", q:"Укажите, какие из перечисленных элементов входят в состав реляционной таблицы:",
 o:["+Заголовок отношения (схема отношения)","+Тело отношения","+Атрибуты (столбцы)","+Кортежи (строки, записи)","?Первичный ключ","-Вложенная таблица в поле","-Формы и отчёты","-Макросы","-Указатели на другие записи"],
 ex:"Отношение = заголовок (набор атрибутов, их число — степень отношения) + тело (набор кортежей, их число — мощность). Первичный ключ есть у каждого отношения, но это набор атрибутов, а не отдельная часть таблицы. Поэтому он помечен как спорный и при проверке не учитывается."},
{n:22, t:"o", q:"Расставьте основные элементы, используемые для построения описания РЕЛЯЦИОННОЙ ТАБЛИЦЫ (от простого к сложному).",
 items:["Тип данных","Домен","Атрибут","Кортеж","Отношение"],
 ex:"Тип данных → домен (подмножество типа со смыслом) → атрибут (пара «имя: домен») → кортеж (набор пар «атрибут: значение») → отношение (заголовок + тело). Если в списке есть «схема БД», она идёт последней."},
{n:23, t:"p", sample:6, q:"Основные понятия реляционной модели. Укажите соответствие обычного наименования (слева) и элемента реляционной модели.",
 pairs:[["Таблица","Отношение"],["Запись (строка) таблицы","Кортеж"],["Название столбца","Атрибут"],["Заголовок таблицы","Схема отношения"],["Набор заголовков таблиц","Схема БД"],["Множество допустимых значений столбца","Домен"],["Тип столбца (число, строка, дата)","Тип данных"],["Число столбцов","Степень отношения"],["Число строк","Мощность отношения"],["Столбец с уникальными значениями (табельный номер)","Первичный ключ"]],
 ex:"Таблица — отношение, запись — кортеж, столбец — атрибут, заголовок таблицы — схема отношения, набор заголовков — схема БД. Число атрибутов — степень, число кортежей — мощность. При каждой попытке выбирается 6 случайных пар из 10."},
{n:24, t:"m", q:"К обязательным (фундаментальным) свойствам реляционной таблицы (отношения) относятся:",
 o:["+Отсутствие кортежей-дубликатов","+Отсутствие упорядоченности кортежей","+Отсутствие упорядоченности атрибутов","+Атомарность значений атрибутов","-Упорядоченность строк по первичному ключу","-Фиксированный порядок столбцов","-Наличие индекса","-Возможность хранить в поле множество значений","-Обязательное заполнение всех полей (нет NULL)"],
 ex:"Четыре фундаментальных свойства отношений: нет кортежей-дубликатов, нет порядка кортежей, нет порядка атрибутов, значения атрибутов атомарны. Результат с ORDER BY — уже не отношение, а упорядоченный список кортежей."},
{n:25, t:"s", q:"Какое из свойств реляционной таблицы определяет наличие в ней первичного ключа?",
 o:["+Отсутствие кортежей-дубликатов","-Отсутствие упорядоченности кортежей","-Отсутствие упорядоченности атрибутов","-Атомарность значений атрибутов","-Целостность по ссылкам"],
 ex:"Отношение — множество, а в множестве нет одинаковых элементов. Значит, у каждого отношения есть набор атрибутов, однозначно определяющий кортеж, — первичный ключ."},
{n:26, t:"s", q:"Для построения первичного ключа может использоваться:",
 o:["+Набор атрибутов (один или несколько), значения которых однозначно определяют кортеж","-Только числовое поле","-Любое поле, даже с повторяющимися значениями","-Внешний ключ","-Порядковый номер строки в файле","-Индекс таблицы"],
 ex:"Первичный ключ — набор атрибутов, однозначно определяющий кортеж. Он должен быть минимальным: в нём нет атрибутов, без которых свойство сохраняется. Теоретически ключом может служить весь набор атрибутов, на практике — чаще один столбец (табельный номер, ИНН)."},
{n:27, t:"s", q:"Свойство атомарности реляционной таблицы означает:",

/* ---------- Утилиты ---------- */
const rnd = n => Math.floor(Math.random() * n);
const range = n => Array.from({length:n}, (_, i) => i);
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const uniq = a => Array.from(new Set(a));
const norm = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9]+/g, " ").trim();
function parseOpts(a){ return a.map(s => ({t:s.slice(1), ok: s[0] === "+" ? true : (s[0] === "?" ? "maybe" : false)})); }
function plural(n, one, few, many){ const m10 = n % 10, m100 = n % 100; if(m10 === 1 && m100 !== 11) return one; if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }

const SURN = ["Иванов","Петров","Сидоров","Фёдоров","Смирнов","Кузнецов","Попов","Волков","Соколов","Лебедев","Козлов","Новиков","Морозов","Орлов"];
function genAB(op){
  const names = shuffle(SURN).slice(0, 12);
  const nA = 4 + rnd(3), nB = 3 + rnd(4);
  const k = 1 + rnd(Math.min(nA, nB) - 1);
  const common = names.slice(0, k), onlyA = names.slice(k, nA), onlyB = names.slice(nA, nA + nB - k);
  const num = {}; names.forEach((s, i) => { num[s] = 2931 + i; });
  const A = shuffle(common.concat(onlyA)).map(s => [num[s], s]);
  const B = shuffle(common.concat(onlyB)).map(s => [num[s], s]);
  const opName = {union:"ОБЪЕДИНЕНИЯ (A ∪ B)", inter:"ПЕРЕСЕЧЕНИЯ (A ∩ B)", minus:"ВЫЧИТАНИЯ (A − B)"}[op];
  const cs = common.join(", ");
  let ans, ex;
  if(op === "union"){ ans = nA + nB - k; ex = `Общие записи (есть в обеих таблицах): ${cs} — их ${k}. Объединение включает каждую запись один раз: ${nA} + ${nB} − ${k} = ${ans}.`; }
  else if(op === "inter"){ ans = k; ex = `Пересечение — записи, которые есть и в A, и в B: ${cs}. Итого ${k}.`; }
  else { ans = nA - k; ex = `A − B — записи A, которых нет в B: ${onlyA.join(", ")}. Итого ${nA} − ${k} = ${ans}.`; }
  ex += " Правило: объединение = |A| + |B| − общие; пересечение = общие; разность A − B = |A| − общие. Данные меняются при каждой попытке.";
  return {t:"n", q:`Таблицы A и B имеют одинаковую структуру (совместимы по объединению). При выполнении операции ${opName} получится таблица C. Сколько в ней записей?`, ans, ex, extra:{kind:"ab", A, B}};
}

function prepare(q, variant){

  const v = q.alt ? (variant || VARPREF[q.n] || "file") : null;
  const it = inst || (v === "file" ? q.altFull : q);

  if(it.t === "s"){ st.ord = shuffle(range(it.o.length)); st.sel = null; }
  else if(it.t === "m"){ st.ord = shuffle(range(it.o.length)); st.sel = []; }
  else if(it.t === "o"){ let p = shuffle(range(it.items.length)); if(p.every((v, i) => v === i)) p = p.reverse(); st.pool = p; st.sel = []; }

    case "o": return st.sel.length === it.items.length;
    case "p": return st.sel.every(v => v !== null && v !== undefined);

    case "m": return it.o.every((o, i) => o.ok === "maybe" || ((o.ok === true) === st.sel.includes(i)));
    case "o": return st.sel.every((v, i) => v === i);

    case "n": { const v = Number(String(st.sel).replace(",", ".").trim()); return v === it.ans; }

}

function renderChoice(it, st){
  const single = it.t === "s";
  const list = h("div", {class:"opts" + (single ? " single" : ""), role:single ? "radiogroup" : "group"});
  st.ord.forEach(i => {
    const o = it.o[i];
    const sel = single ? st.sel === i : st.sel.includes(i);
    let cls = "opt" + (sel && !st.done ? " sel" : ""), tag = null;
    if(st.done){
      if(o.ok === true && sel) cls += " good";
      else if(o.ok === true){ cls += single ? " good" : " missed"; tag = single ? "верный ответ" : "нужно было отметить"; }
      else if(o.ok === false && sel){ cls += " wrong"; tag = single ? "ваш ответ" : "лишний вариант"; }
      else if(o.ok === "maybe"){ cls += " maybe"; tag = "спорный вариант, при проверке не учитывается"; }
      else cls += " dim";
    }
    list.append(h("button", {class:cls, type:"button", role:single ? "radio" : "checkbox", "aria-checked":String(sel), disabled:st.done || null,
      onclick:() => { if(single) st.sel = i; else st.sel = sel ? st.sel.filter(x => x !== i) : st.sel.concat(i); rerender(); }},
      h("span", {class:"box", "aria-hidden":"true"}), h("span", null, o.t), tag ? h("span", {class:"opt-tag"}, tag) : null));
  });
  return list;
}
function renderOrder(it, st){
  const wrap = h("div", {class:"ord"});
  const ans = h("ol", {class:"ord-ans"});
  st.sel.forEach((itemIdx, pos) => {
    let cls = "ord-item";
    if(st.done) cls += itemIdx === pos ? " good" : " wrong";
    ans.append(h("li", null, h("button", {class:cls, type:"button", disabled:st.done || null, "aria-label":`Убрать: ${it.items[itemIdx]}`,
      onclick:() => { st.sel.splice(pos, 1); rerender(); }},
      h("span", {class:"ord-n"}, pos + 1), h("span", null, it.items[itemIdx]))));
  });
  if(!st.sel.length) ans.append(h("li", {class:"ord-empty"}, "Здесь появится ваш порядок"));
  wrap.append(h("div", {class:"blabel"}, "Ваш порядок"), ans);
  const rest = st.pool.filter(i => !st.sel.includes(i));
  if(!st.done && rest.length){
    const pool = h("div", {class:"ord-pool"});
    rest.forEach(i => pool.append(h("button", {class:"chip-opt", type:"button", onclick:() => { st.sel.push(i); rerender(); }}, it.items[i])));
    wrap.append(h("div", {class:"blabel"}, "Варианты"), pool);
  }
  return wrap;
}
function renderMatch(it, st){
  const wrap = h("div", {class:"ord"});
  const legend = h("ol", {class:"legend"});
  st.right.forEach((pi, k) => legend.append(h("li", null, h("span", {class:"let"}, LET[k]), h("span", null, it.pairs[pi][1]))));
  const rows = h("div", {class:"match"});
  st.left.forEach((li, i) => {
    const chosen = st.sel[i], correctK = st.right.indexOf(li);
    let cls = "mrow";
    if(st.done) cls += chosen === correctK ? " good" : " wrong";
    const chips = h("div", {class:"lets", role:"radiogroup", "aria-label":it.pairs[li][0]});
    st.right.forEach((pi, k) => chips.append(h("button", {type:"button",
      class:"letbtn" + (chosen === k ? " sel" : "") + (st.done && k === correctK && chosen !== k ? " right" : ""),
      role:"radio", "aria-checked":String(chosen === k), disabled:st.done || null,
      onclick:() => { st.sel[i] = k; rerender(); }}, LET[k])));
    rows.append(h("div", {class:cls},
      h("div", {class:"mleft"}, it.pairs[li][0], st.done && chosen !== correctK ? h("span", {class:"mfix"}, "верно: " + LET[correctK]) : null),
      chips));
  });
  wrap.append(h("div", {class:"blabel"}, "Варианты"), legend, h("div", {class:"blabel"}, "Сопоставьте"), rows);
  return wrap;
}
function renderInput(q, it, st, mode){
  const inp = h("input", {class:"inp", id:`ans-${mode}-${st.key}`, type:"text", inputmode:it.t === "n" ? "numeric" : null,
    autocomplete:"off", spellcheck:"false", value:st.sel, disabled:st.done || null, "aria-label":"Ваш ответ",
    placeholder:it.t === "n" ? "Число" : "Ваш ответ"});
  inp.addEventListener("input", () => {
    st.sel = inp.value;
    const b = inp.closest(".card").querySelector(".btn-check");
    if(b) b.disabled = !complete(it, st);
  });
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); if(complete(it, st)) doCheck(q, st, mode); } });
  return inp;
}
function renderFeedback(q, it, st){
  const box = h("div", {class:"fb", role:"status"});
  box.append(h("div", {class:"fb-v"}, st.gave ? "Правильный ответ" : (st.ok ? "Верно" : "Неверно")));
  if(q.alt) box.append(h("p", {class:"var-src"}, st.variant === "file" ? "Проверено по варианту из файла «Редька тест БД»." : "Проверено по варианту, который составил Claude по лекциям."));
  if(it.t === "o"){
    const ol = h("ol", {class:"fb-list"}); it.items.forEach(s => ol.append(h("li", null, s)));
    box.append(h("div", {class:"fb-h"}, "Правильный порядок"), ol);
  }
  if(it.t === "p"){
    const g = h("div", {class:"fb-pairs"});
    st.left.forEach(li => g.append(h("div", {class:"fb-pair"}, h("span", {class:"l"}, it.pairs[li][0]), h("span", {class:"arrow"}, "→"), h("span", null, it.pairs[li][1]))));
    box.append(h("div", {class:"fb-h"}, "Правильные пары"), g);
  }
  if(it.t === "x" || it.t === "n") box.append(h("div", {class:"fb-h"}, "Ответ"), h("p", {class:"fb-ans"}, String(it.ans)));
  box.append(h("div", {class:"fb-h"}, "Пояснение"), h("p", {class:"fb-ex"}, it.ex));
  if(q.alt){
    const other = st.variant === "file" ? q : q.altFull;
    box.append(h("div", {class:"fb-h"}, st.variant === "file" ? "Ответ в варианте Claude (по лекциям)" : "Ответ в варианте из файла «Редька тест БД»"),
      h("p", {class:"fb-ex"}, answerText(other)),
      h("div", {class:"fb-h"}, "Почему варианты расходятся"), h("p", {class:"fb-ex"}, q.altNote));
  }
  return box;
}
function renderCard(q, st, mode){
  const it = itOf(q, st);
  const card = h("article", {class:"card" + (st.done && !st.gave ? (st.ok ? " is-ok" : " is-bad") : (st.done ? " is-bad" : ""))});
  card.append(h("div", {class:"qmeta"}, h("span", {class:"qnum"}, "№ " + parseInt(st.key, 10)), h("span", {class:"tag"}, TYPE[it.t]), q.alt ? h("span", {class:"tag tag-var"}, varName(st.key) + " · 1 из 2".replace("1", keyVar(st.key) === "file" ? "1" : "2")) : null, h("span", null, SECT[q.sec].name)));
  card.append(h("h2", {class:"qtext"}, it.q));
  if(q.alt){
    const isFile = st.variant === "file";
    card.append(h("div", {class:"variant"},
      h("div", {class:"var-h"}, "Ответы в файле и у Claude расходятся — этот вопрос нужно пройти в двух вариантах."),
      h("p", {class:"var-src"}, isFile ? "Вариант 1 из 2 — из файла «Редька тест БД»: правильный ответ взят из файла, варианты-ловушки добавил Claude." : "Вариант 2 из 2 — составил Claude по лекциям из архива: и варианты, и правильный ответ.")));
  }
  if(it.extra) card.append(renderExtra(it.extra));
  if(!st.done) card.append(h("p", {class:"hint"}, HINT[it.t]));
  if(it.t === "s" || it.t === "m") card.append(renderChoice(it, st));
  else if(it.t === "o") card.append(renderOrder(it, st));
  else if(it.t === "p") card.append(renderMatch(it, st));
  else card.append(renderInput(q, it, st, mode));
  const acts = h("div", {class:"actions"});
  if(!st.done){
    acts.append(h("button", {class:"btn primary btn-check", type:"button", disabled:!complete(it, st) || null, onclick:() => doCheck(q, st, mode)}, "Проверить"));
    acts.append(h("button", {class:"btn", type:"button", onclick:() => doGiveUp(q, st, mode)}, mode === "round" ? "Не знаю — показать ответ" : "Показать ответ"));
    card.append(acts);
  } else if(mode === "view"){
    acts.append(h("button", {class:"btn btn-next", type:"button", onclick:() => { browseSt[st.key] = prepKey(st.key); rerender(); }}, "Ответить ещё раз"));
    card.append(acts);
  }
  if(st.done) card.append(renderFeedback(q, it, st));
  return card;
}

/* ---------- Экраны ---------- */
function renderHeader(){
  $("#round-name").textContent = `Круг ${round.no} · ${round.name}`;
  $("#round-sql").textContent = round.sql;
  const c = counts(), len = round.queue.length;
  $("#round-stats").replaceChildren(
    h("span", {class:"stat"}, "вопрос ", h("b", null, Math.min(round.idx + 1, len)), " из ", h("b", null, len)),
    h("span", {class:"stat ok"}, "верно ", h("b", null, c.ok)),
    h("span", {class:"stat bad"}, "ошибок ", h("b", null, c.bad)));
  const strip = $("#strip"); strip.replaceChildren();
  round.queue.forEach((n, i) => {
    const s = round.res[n];
    let cls = "seg";
    if(s && s.done) cls += s.ok ? " ok" : " bad";
    if(i === round.idx && view === "test") cls += " cur";
    strip.append(h("button", {class:cls, type:"button", title:`№ ${keyLabel(n)}`, "aria-label":`Перейти к вопросу ${keyLabel(n)}`, onclick:() => goTo(i)}));
  });
  $("#btn-list").setAttribute("aria-pressed", String(view === "list"));
  $("#btn-menu").setAttribute("aria-pressed", String(view === "menu"));
}
function renderTest(){
  const v = $("#v-test"); v.replaceChildren();
  const n = round.queue[round.idx], q = keyQ(n), st = getSt(n);
  v.append(renderCard(q, st, "round"));
  const last = round.idx === round.queue.length - 1;
  v.append(h("div", {class:"qnav"},
    h("button", {class:"btn ghost", type:"button", disabled:round.idx === 0 || null, onclick:() => goTo(round.idx - 1)}, "← Назад"),
    h("span", {class:"pos"}, `${round.idx + 1} / ${round.queue.length}`),
    st.done
      ? h("button", {class:"btn primary btn-next", type:"button", onclick:goNext}, last ? "К итогам круга →" : "Дальше →")
      : h("button", {class:"btn ghost", type:"button", onclick:goNext}, last ? "Пропустить, к итогам →" : "Пропустить →")));
}
function qRow(n, label){
  const q = keyQ(n), s = prog.status[n];
  return h("button", {class:"row" + (s === "ok" ? " ok" : s === "bad" ? " bad" : ""), type:"button", onclick:() => openView(n)},
    h("span", {class:"num"}, parseInt(n, 10)), h("span", {class:"rt"}, q.alt ? `(${varName(n)}) ${q.q}` : q.q), h("span", {class:"rk"}, label || TYPE_SHORT[typeOf(q)]));
}
function renderSummary(){
  const v = $("#v-summary"); v.replaceChildren();
  const c = counts(), total = round.queue.length;
  const again = round.queue.filter(n => { const s = round.res[n]; return !s || !s.done || !s.ok; });
  const wrongN = c.bad, skipN = c.left;
  const pOk = total ? c.ok / total * 100 : 0, pBad = total ? c.bad / total * 100 : 0;
  const panel = h("div", {class:"panel"},
    h("h1", {class:"h1"}, `Круг ${round.no} пройден`),
    h("div", {class:"score"}, c.ok, h("small", null, `из ${total} верно`)),
    h("div", {class:"bar", "aria-hidden":"true"}, h("span", {class:"b-ok", style:`width:${pOk}%`}), h("span", {class:"b-bad", style:`width:${pBad}%`})),
    h("p", {class:"muted"}, `Ошибок: ${wrongN}. Пропущено: ${skipN}.`));
  const acts = h("div", {class:"actions"});
  if(again.length){
    acts.append(h("button", {class:"btn primary", type:"button", onclick:() => startRound("retry", again, `Повтор ошибок круга ${round.no} (${again.length})`, "SELECT * FROM Вопросы WHERE Ответ <> 'верно' OR Ответ IS NULL")},
      `Пройти заново неверные (${again.length})`));
  } else {
    panel.append(h("p", {class:"muted"}, "Все вопросы этого круга отвечены верно. Для закрепления пройдите весь тест вперемешку."));
  }
  acts.append(h("button", {class:"btn", type:"button", onclick:() => startRound("shuffle", shuffle(ALL), "Весь тест вперемешку", "SELECT * FROM Вопросы -- случайный порядок")}, "Весь тест вперемешку"));
  acts.append(h("button", {class:"btn ghost", type:"button", onclick:() => goTo(round.queue.length - 1)}, "← К последнему вопросу"));
  panel.append(acts);
  v.append(h("div", {class:"stack"}, panel,
    again.length ? h("div", {class:"stack"},
      h("div", {class:"sec-h"}, "Вопросы для повторения — нажмите, чтобы посмотреть ответ"),
      h("div", {class:"rows"}, again.map(n => { const s = round.res[n]; return qRow(n, s && s.done ? "ошибка" : "пропущен"); }))) : null));
}
function renderListRows(host){
  host.replaceChildren();
  const qn = norm(listQ);
  let shown = 0;
  for(let k = 1; k <= 4; k++){
    const items = sectionQueue(k).filter(n => {
      const s = prog.status[n];
      if(listFilter === "bad" && s !== "bad") return false;
      if(listFilter === "ok" && s !== "ok") return false;
      if(listFilter === "none" && s) return false;
      if(qn && !norm(keyLabel(n) + " " + (keyQ(n).alt ? varName(n) + " " : "") + keyQ(n).q).includes(qn)) return false;
      return true;
    });
    if(!items.length) continue;
    shown += items.length;
    host.append(h("div", {class:"sec-h"}, `Раздел ${k}. ${SECT[k].name} · ${SECT[k].from}–${SECT[k].to}`), h("div", {class:"rows"}, items.map(n => qRow(n))));
  }
  if(!shown) host.append(h("p", {class:"muted"}, "Ничего не найдено. Измените фильтр или поисковую строку."));
}
function renderList(){
  const v = $("#v-list"); v.replaceChildren();
  const sc = statusCounts();
  const rowsHost = h("div", null);
  const filters = h("div", {class:"filters", role:"group", "aria-label":"Фильтр"});
  [["all", "Все", ALL.length], ["bad", "Ошибки", sc.bad], ["none", "Без ответа", sc.none], ["ok", "Верно", sc.ok]].forEach(([k, label, cnt]) =>
    filters.append(h("button", {class:"fchip", type:"button", "aria-pressed":String(listFilter === k), onclick:() => { listFilter = k; renderList(); }}, `${label} · ${cnt}`)));
  const search = h("input", {class:"inp", id:"list-search", type:"search", placeholder:"Поиск по тексту или номеру", value:listQ, "aria-label":"Поиск вопроса", autocomplete:"off"});
  search.addEventListener("input", () => { listQ = search.value; renderListRows(rowsHost); });
  v.append(h("div", {class:"stack"},
    h("div", {class:"backbar"}, h("button", {class:"btn primary", type:"button", onclick:returnBack}, backLabel())),
    h("div", null, h("h1", {class:"h1"}, "Все вопросы"),
      h("p", {class:"muted"}, `По последнему ответу: верно ${sc.ok}, ошибок ${sc.bad}, без ответа ${sc.none}. Нажмите на вопрос, чтобы открыть его; текущий круг при этом не меняется.`)),
    filters, search, rowsHost));
  renderListRows(rowsHost);
}
function renderView(){
  const v = $("#v-view"); v.replaceChildren();
  const q = keyQ(viewN);
  if(!browseSt[viewN]) browseSt[viewN] = prepKey(viewN);
  const st = browseSt[viewN];
  const i = ALL.indexOf(viewN);
  v.append(h("div", {class:"stack"},
    h("div", {class:"backbar"},
      h("button", {class:"btn primary", type:"button", onclick:returnBack}, backLabel()),
      h("button", {class:"btn ghost", type:"button", onclick:openList}, "Все вопросы")),
    h("p", {class:"note"}, "Режим просмотра: ответ здесь не влияет на текущий круг теста."),
    renderCard(q, st, "view"),
    h("div", {class:"qnav"},
      h("button", {class:"btn ghost", type:"button", disabled:i === 0 || null, onclick:() => { viewN = ALL[i - 1]; rerender(); toTop(); }}, i > 0 ? `← № ${keyLabel(ALL[i - 1])}` : "←"),
      h("span", {class:"pos"}, `${i + 1} из ${ALL.length}`),
      h("button", {class:"btn ghost", type:"button", disabled:i === ALL.length - 1 || null, onclick:() => { viewN = ALL[i + 1]; rerender(); toTop(); }}, i < ALL.length - 1 ? `№ ${keyLabel(ALL[i + 1])} →` : "→"))));
}
function menuItem(title, desc, sql, onclick, disabled){
  return h("button", {class:"menu-item", type:"button", disabled:disabled || null, onclick},
    h("span", {class:"mi-t"}, title), h("span", {class:"mi-d"}, desc), sql ? h("span", {class:"mi-sql"}, sql) : null);
}
function renderMenu(){
  const v = $("#v-menu"); v.replaceChildren();
  const sc = statusCounts();
  const notOk = ALL.filter(n => prog.status[n] !== "ok");
  const bad = ALL.filter(n => prog.status[n] === "bad");
  const list = h("div", {class:"menu-list"},
    menuItem("Весь тест по порядку", `${ALL.length} заданий: 70 вопросов, в 8 из них два варианта`, "SELECT * FROM Вопросы ORDER BY Номер", () => startRound("all", ALL.slice(), "Весь тест по порядку", "SELECT * FROM Вопросы ORDER BY Номер")),
    menuItem("Весь тест вперемешку", `${ALL.length} заданий в случайном порядке`, "SELECT * FROM Вопросы -- случайный порядок", () => startRound("shuffle", shuffle(ALL), "Весь тест вперемешку", "SELECT * FROM Вопросы -- случайный порядок")),
    menuItem("Только ошибки", bad.length ? `${bad.length} ${plural(bad.length, "вопрос", "вопроса", "вопросов")} с последним неверным ответом` : "Ошибок пока нет", "SELECT * FROM Вопросы WHERE Ответ = 'неверно'",
      () => startRound("bad", bad, `Только ошибки (${bad.length})`, "SELECT * FROM Вопросы WHERE Ответ = 'неверно'"), !bad.length),
    menuItem("Всё, что ещё не отвечено верно", notOk.length ? `${notOk.length} ${plural(notOk.length, "вопрос", "вопроса", "вопросов")}` : "Все 70 вопросов отвечены верно", "SELECT * FROM Вопросы WHERE Ответ IS NULL OR Ответ = 'неверно'",
      () => startRound("notok", notOk, `Не отвеченные верно (${notOk.length})`, "SELECT * FROM Вопросы WHERE Ответ IS NULL OR Ответ = 'неверно'"), !notOk.length));
  for(let k = 1; k <= 4; k++){
    const s = SECT[k], qq = sectionQueue(k);
    const sql = `SELECT * FROM Вопросы WHERE Номер BETWEEN ${s.from} AND ${s.to}`;
    list.append(menuItem(`Раздел ${k}. ${s.name}`, `${qq.length} ${plural(qq.length, "вопрос", "вопроса", "вопросов")}, № ${s.from}–${s.to}`, sql, () => startRound("sec", qq, `Раздел ${k}. ${s.name}`, sql)));
  }
  const reset = menuConfirm
    ? h("div", {class:"confirm"}, h("span", null, "Сбросить ответы по всем 70 вопросам и начать заново?"),
        h("button", {class:"btn primary", type:"button", onclick:() => { prog.status = {}; roundNo = 0; Object.keys(browseSt).forEach(k => delete browseSt[k]); startRound("all", ALL.slice(), "Весь тест по порядку", "SELECT * FROM Вопросы ORDER BY Номер"); }}, "Да, сбросить"),
        h("button", {class:"btn", type:"button", onclick:() => { menuConfirm = false; renderMenu(); }}, "Отмена"))
    : h("button", {class:"btn ghost", type:"button", onclick:() => { menuConfirm = true; renderMenu(); }}, "Сбросить весь прогресс");
  v.append(h("div", {class:"stack"},
    h("div", {class:"backbar"}, h("button", {class:"btn primary", type:"button", onclick:returnBack}, backLabel())),
    h("div", null, h("h1", {class:"h1"}, "Новый круг"),
      h("p", {class:"muted"}, `Текущий круг заменится новым, общий прогресс сохранится. Сейчас верно отвечено ${sc.ok} из ${ALL.length} заданий.`)),
    list, h("div", null, reset)));
}
function rerender(){
  if(view === "test" && round.idx >= round.queue.length) view = "summary";
  for(const k of ["test", "summary", "list", "view", "menu"]) $("#v-" + k).hidden = k !== view;
  renderHeader();
  ({test:renderTest, summary:renderSummary, list:renderList, view:renderView, menu:renderMenu})[view]();
}

/* ---------- Запуск ---------- */
function boot(){
  const saved = load();
  applyState(saved);
  if(!round) round = makeRound("all", ALL.slice(), "Весь тест по порядку", "SELECT * FROM Вопросы ORDER BY Номер");
  view = round.idx >= round.queue.length ? "summary" : "test";
  $("#btn-list").addEventListener("click", () => view === "list" ? returnBack() : openList());
  $("#btn-menu").addEventListener("click", () => view === "menu" ? returnBack() : openMenu());
  document.addEventListener("keydown", e => {
    if(e.key !== "Enter" || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "button" || tag === "input" || tag === "textarea" || tag === "a") return;
    if(view !== "test") return;
    const n = round.queue[round.idx], q = keyQ(n), st = getSt(n);
    e.preventDefault();
    if(st.done) goNext(); else if(complete(itOf(q, st), st)) doCheck(q, st, "round");
  });
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushRemote(); });
  window.addEventListener("pagehide", () => flushRemote());
  rerender();
  updateSyncNote();
  initRemote();
}
boot();
</script>
</html>
